name: release / production-sync

# 태그(vX.Y.Z)를 푸시하면 production 브랜치를 그 시점의 main 내용으로 맞추는
# "production <- main (vX.Y.Z)" PR을 자동으로 연다. 병합은 사람이 직접 한다 —
# 이 워크플로는 PR을 열기만 하고 절대 자동 병합하지 않는다.
# 배경: docs/skills/github-flow-and-release.md의 "Release from tags" 규칙을
# 실제로 동작하게 만드는 장치. production 브랜치는 GitHub 브랜치 보호가 걸려
# 있지 않지만 Vercel 프로덕션 배포 대상이므로, main/release/*에 준하는 방식으로
# 다룬다 — 직접 push나 자동 병합 없이 항상 PR을 거친다.
on:
  push:
    tags: ['v*']

concurrency:
  group: production-sync-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      # 태그 이벤트로 체크아웃하면 다른 브랜치는 가져오지 않는다.
      # 아래 트리 비교/브랜치 생성에 production의 현재 상태가 필요하다.
      - name: Fetch production branch
        run: git fetch --no-tags origin +refs/heads/production:refs/remotes/origin/production

      - name: Sync production to this tag
        env:
          GH_TOKEN: ${{ github.token }}
          # PR 본문 템플릿. __TAG_NAME__ / __COMPARE_URL__는 아래 run 스크립트가
          # 치환한다. 이 값을 bash heredoc으로 run: 블록 안에 직접 넣으면 마크다운
          # 제목(#으로 시작하는 줄)이 YAML 블록 스칼라 들여쓰기를 깨뜨리므로,
          # 여기 env로 분리해 순수 YAML 블록 스칼라로만 다룬다.
          PR_BODY_TEMPLATE: |
            ## Summary

            __TAG_NAME__ 태그 기준으로 production을 main과 동일한 내용으로 맞추는 자동 동기화 PR이다.
            비교: __COMPARE_URL__

            ## Linked issue

            Closes #

            (production을 base로 하는 PR은 agent-guardrails.yml에서 이 검사가 면제된다 —
            docs/skills/github-flow-and-release.md 참고. 이 PR이 반영하는 각 커밋은 main에
            머지될 때 이미 각자의 이슈를 닫았다.)

            ## Branch

            - Type: release-sync (자동 생성, `type/issue-area-slug` 규칙 대상 아님)
            - Area: ci
            - head는 `__TAG_NAME__` 태그 시점에 고정된 브랜치이며 main과 별개로 관리된다

            ## Scope

            ### In scope
            - production을 __TAG_NAME__ 시점 main 내용과 동일하게 맞춘다

            ### Out of scope
            - 그 외 모든 코드 변경 (각 커밋은 main에 머지되며 이미 개별적으로 리뷰되었다)
            - 알려진 하이드레이션 이슈 #91/#92/#93 수정 — 이번 동기화로 production에도 함께 올라가지만 별도로 추적 중이며 회귀가 아니다

            ## Spec alignment

            - [x] No silent scope expansion was introduced
            - [x] If behavior changed, the spec/docs were updated in the same PR (해당 변경들은 각자의 main PR에서 이미 처리됨)

            ## Testing

            - [x] ci.yml이 이 PR(production base)에도 동일하게 실행된다

            ## Risks

            - production이 최신 main 코드로 즉시 교체된다 (Vercel 자동 재배포)

            ## Rollback / recovery

            - production을 이 PR 이전 커밋으로 되돌리면 이전 배포 상태로 복구된다
        run: |
          set -euo pipefail

          TAG_NAME="${GITHUB_REF#refs/tags/}"
          SYNC_BRANCH="sync/production-${TAG_NAME}"

          # 체크아웃된 HEAD가 곧 이 태그가 가리키는 커밋이므로, 태그 ref를 따로
          # 참조하지 않고 HEAD 트리를 그대로 "이 릴리스가 배포해야 할 내용"으로 쓴다.
          RELEASE_TREE="$(git rev-parse HEAD^{tree})"
          PRODUCTION_TREE="$(git rev-parse origin/production^{tree})"

          # 멱등성 가드: 커밋 조상 관계가 아니라 트리 내용을 비교한다.
          # production으로 향하는 동기화 PR은 (기존 PR #70처럼) squash 병합될 수
          # 있으므로, merge-base --is-ancestor 같은 조상 기반 판정은 병합 직후
          # 오탐한다. 트리 해시 비교는 병합 전략과 무관하게 정확하다.
          if [ "$RELEASE_TREE" = "$PRODUCTION_TREE" ]; then
            echo "production이 이미 ${TAG_NAME}과 동일한 내용이다. 할 일 없음."
            exit 0
          fi

          # 중복 실행 가드: 동일 태그로 워크플로가 재실행되어도(예: 수동 재시도)
          # 이미 열려 있는 동기화 브랜치/PR을 다시 만들지 않는다.
          if git ls-remote --exit-code --heads origin "$SYNC_BRANCH" >/dev/null 2>&1; then
            echo "동기화 브랜치 ${SYNC_BRANCH}가 이미 존재한다. PR이 이미 열려 있거나 진행 중으로 간주하고 종료."
            exit 0
          fi

          # main이 리뷰 도중 더 진행되어도 이 PR의 diff가 흔들리지 않도록,
          # head를 main이 아니라 태그에 고정된 새 브랜치로 만든다.
          git branch "$SYNC_BRANCH" HEAD
          git push origin "$SYNC_BRANCH"

          COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/compare/production...${TAG_NAME}"

          PR_BODY="${PR_BODY_TEMPLATE//__TAG_NAME__/$TAG_NAME}"
          PR_BODY="${PR_BODY//__COMPARE_URL__/$COMPARE_URL}"

          gh pr create \
            --base production \
            --head "$SYNC_BRANCH" \
            --title "production <- main (${TAG_NAME})" \
            --body "$PR_BODY"
