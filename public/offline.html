<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>오프라인 · 웨더페인</title>
    <style>
      body {
        font:
          1rem/1.7 system-ui,
          sans-serif;
        margin: 0;
      }
      main {
        max-width: 32rem;
        margin: 15vh auto;
        padding: 1.5rem;
      }
      h1 {
        font-size: clamp(1.75rem, 6vw, 2.5rem);
        line-height: 1.3;
      }
      a {
        display: inline-block;
        padding: 0.75rem 0;
        margin-right: 1.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p>웨더페인</p>
      <h1>인터넷 연결을 확인해 주세요</h1>
      <p>
        이 페이지는 아직 오프라인에서 열 수 없어요. 연결이 돌아오면 다시 시도해
        주세요.
      </p>
      <nav aria-label="오프라인 복구">
        <a href="">다시 시도</a>
        <a href="/">홈으로</a>
      </nav>
    </main>
  </body>
</html>
